[project]
name = "yulab-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.2",
  "uvicorn==0.41.0",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
  "datamodel-code-generator==0.82.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
