[project]
name = "yulab-learning"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.13.0+cu130",
  "numpy==2.4.2",
  "scipy==1.17.1",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
  "pytest==9.0.2",
  "matplotlib==3.10.9",
  "psutil==7.2.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
