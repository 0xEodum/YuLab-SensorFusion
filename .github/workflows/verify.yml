name: SF-01 foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.17
      - run: npm ci
      - run: npm run backend:sync
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:browser
        # Windows software-WebGL browser runs stall on the hosted runner.
        # Core checks still run on both OSes; local Windows Edge is verified separately.
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-${{ matrix.os }}
          path: |
            artifacts/browser/
            test-results/
          if-no-files-found: ignore
